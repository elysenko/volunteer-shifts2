<main class="auth" data-testid="signup-page">
  <section class="auth-card card">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">🤝</span>
      <h1 class="auth-title">ShiftHands</h1>
      <p class="auth-tag">Join as a volunteer and start giving back.</p>
    </div>

    <h2 class="auth-heading">Create your account</h2>

    @if (error()) {
      <div class="alert alert-error" data-testid="signup-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="Alex Morgan"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          data-testid="signup-name"
        />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.org"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          data-testid="signup-email"
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="At least 6 characters"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          data-testid="signup-password"
        />
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input
          id="confirm"
          name="confirm"
          type="password"
          autocomplete="new-password"
          placeholder="Re-enter password"
          [ngModel]="confirm()"
          (ngModelChange)="confirm.set($event)"
          data-testid="signup-confirm"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading()"
        data-testid="signup-submit"
      >
        {{ loading() ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-alt">
      Already have an account?
      <a routerLink="/login" data-testid="link-login">Sign in</a>
    </p>
  </section>
</main>
